<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>德國舞曲｜跟著時間軸練琴</title>
<style>
  :root{
    --bg:#fbf7f0; --card:#fff; --ink:#2b2a33; --mute:#8a8794; --line:#d9d4ca;
    --rh:#e4583e; --rh-soft:#fde3dc; --lh:#1d8a86; --lh-soft:#d6f0ee; --head:#3a3946;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;}
  .wrap{max-width:960px;margin:0 auto;padding:14px 12px 40px}
  h1{font-size:20px;margin:4px 0 2px}
  .sub{color:var(--mute);font-size:13px;margin-bottom:12px}
  .card{background:var(--card);border-radius:16px;box-shadow:0 1px 3px rgba(0,0,0,.06);padding:12px;margin-bottom:12px}

  /* 拍子與現在要彈 */
  .status{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;align-items:stretch}
  .box{border-radius:12px;padding:10px;text-align:center}
  .box .lab{font-size:13px;color:var(--mute)}
  .box .big{font-size:26px;font-weight:800;margin-top:4px;min-height:34px}
  .box .fin{font-size:13px;margin-top:2px;min-height:18px}
  .beatbox{background:#f3f0ea}
  .dots{display:flex;justify-content:center;gap:8px;margin-top:8px}
  .dot{width:22px;height:22px;border-radius:50%;background:#e2ddd3;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;transition:transform .08s}
  .dot.on{background:#f2a900;transform:scale(1.25)}
  .rhbox{background:var(--rh-soft)} .rhbox .big{color:var(--rh)}
  .lhbox{background:var(--lh-soft)} .lhbox .big{color:var(--lh)}
  .next{font-size:12px;color:var(--mute);margin-top:4px;min-height:16px}

  /* 樂譜 */
  .scorewrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:12px;background:#fffdf9;border:1px solid #efe9de}
  #score{display:block}
  .staffline{stroke:#555;stroke-width:1}
  .bar{stroke:#444;stroke-width:1.4}
  .ev .head,.ev .stem,.ev .beam,.ev .ledger,.ev .acc,.ev .stac{transition:fill .05s}
  .ev.on .head.fill{fill:currentColor}
  .ev.on .head.hollow{stroke:currentColor;stroke-width:2.6}
  .ev.on .stem,.ev.on .ledger{stroke:currentColor}
  .ev.on .stac,.ev.on .acc{fill:currentColor}
  .ev.rh{color:var(--rh)} .ev.lh{color:var(--lh)}
  .ev.on .glow{opacity:.28}
  .glow{opacity:0;transition:opacity .05s}
  .dim{opacity:.25}
  .fing{font-size:13px;font-weight:700;fill:#555}
  .dyn{font:italic 700 18px Georgia,serif;fill:#333}
  .hint{font-size:12px;color:var(--mute);margin:6px 2px 0}

  .photo{position:relative;overflow:auto;height:min(62vh,520px);border-radius:12px;background:#eee;-webkit-overflow-scrolling:touch}
  .photo.fit{height:auto}
  .inner{position:relative;width:100%}
  .inner img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}
  .inner svg{position:absolute;inset:0;width:100%;height:100%}
  .zoom{display:flex;gap:6px;margin-bottom:8px;font-size:14px;align-items:center;color:var(--mute)}
  .zoom button{padding:6px 12px;font-size:14px;background:#ece7dd;border-radius:8px}
  .zoom button.sel{background:#2b2a33;color:#fff}
  /* 鍵盤 */
  #kbd{width:100%;height:auto;display:block}
  .wk{fill:#fff;stroke:#888;stroke-width:1}
  .bk{fill:#222}
  .wk.rh,.bk.rh{fill:var(--rh)} .wk.lh,.bk.lh{fill:var(--lh)}
  .klab{display:none;font-size:11px;fill:#999;text-anchor:middle;pointer-events:none}
  .klab.c{fill:#555;font-weight:700}

  /* 控制 */
  .ctrls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  button{font:inherit;border:0;border-radius:12px;padding:12px 18px;font-size:17px;font-weight:700;cursor:pointer}
  #play{background:#f2a900;color:#fff;min-width:120px}
  #restart{background:#ece7dd;color:var(--ink)}
  .tempo{flex:1;min-width:220px;display:flex;align-items:center;gap:8px}
  .tempo input{flex:1}
  .tempo b{min-width:64px;text-align:right}
  .opts{display:flex;flex-wrap:wrap;gap:14px;margin-top:10px;font-size:15px}
  .opts label{display:flex;align-items:center;gap:6px}
  select{font:inherit;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:#fff}
  .legend{display:flex;gap:14px;font-size:13px;color:var(--mute);margin-top:8px}
  .sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:4px}
  @media (max-width:560px){
    .box .big{font-size:21px}
    .status{gap:6px}
    .dot{width:18px;height:18px}
  }

  /* ===== 一頁式（iPad）版面 ===== */
  html,body{height:100%;overflow:hidden}
  .wrap{height:100vh;height:100dvh;display:flex;flex-direction:column;padding:8px 10px calc(8px + env(safe-area-inset-bottom));max-width:none}
  h1{font-size:17px;margin:0 0 4px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
  h1 small{font-size:12px;font-weight:400;color:var(--mute)}
  .card{padding:8px;margin-bottom:6px;border-radius:12px}
  .box{padding:5px 6px}
  .box .lab{font-size:12px}
  .box .big{font-size:22px;margin-top:0;min-height:28px}
  .box .fin,.next{font-size:12px;min-height:15px;margin-top:0}
  .dots{margin-top:4px}
  .scorecard{flex:1;min-height:0;display:flex;flex-direction:column}
  .zoom{margin-bottom:6px}
  .zoom .hint2{margin-left:auto;font-size:12px}
  .photo,.photo.fit{flex:1;min-height:0;height:auto;display:flex;align-items:center}
  .photo:not(.fit){display:block}
  #kbd{height:clamp(60px,9vh,100px);width:100%}
  .ctrls{margin-top:6px;gap:8px}
  button{padding:8px 14px;font-size:16px}
  #play{min-width:96px}
  .tempo{min-width:180px}
  .opts{margin-top:0;gap:10px;font-size:14px}
  .follow{display:none;align-items:center;gap:10px;margin-left:auto;font-size:15px}
  .follow.show{display:flex}
  .follow .want{font-size:20px;font-weight:800;color:var(--rh)}
  .meter{width:70px;height:8px;background:#e6e1d6;border-radius:4px;overflow:hidden}
  .meter i{display:block;height:100%;width:0;background:#1d8a86}
  .follow button{padding:6px 10px;font-size:14px;background:#ece7dd}
  .flash{position:absolute;inset:0;pointer-events:none;background:rgba(80,200,120,.0);transition:background .25s}
  .flash.ok{background:rgba(80,200,120,.25);transition:none}
  .hit{width:14px;height:14px;border-radius:50%;background:#e2ddd3;transition:background .15s}
  .hit.on{background:#2fbf5f;transition:none}
  .hit.miss{background:#e4583e;transition:none}
  .hidenames #want,.hidenames #heardBox{visibility:hidden}
  #nameBtn.off{opacity:.5;text-decoration:line-through}
  #msg{font-size:13px;color:#b04a2e}
</style>
</head>

<div class="wrap">
  <h1 style="display:none">🎹 德國舞曲（貝多芬）<small>看橘色線往前走：框起來的音符，就是現在要彈的！</small></h1>

      e.notes.forEach(n=>tone(n.midi,Math.max(ctxAt(e.lt),ctx.currentTime),dur,vol));

const FN=1024, ring=new Float32Array(FN), hann=new Float32Array(FN), re=new Float32Array(FN), im=new Float32Array(FN);

   1. 起音要很快（鋼琴是敲擊樂器，人聲、說話是慢慢變大的）
   2. 敲下去後音量要往下降（人聲會撐住或變大）
   3. 新增的聲音要有清楚的音高（拍手、敲桌子這類雜音沒有）
   4. 音高要在鋼琴這首曲子的範圍附近
   通過才算「鋼琴按鍵」，再用新增的頻譜判斷彈了哪些音。 */
const BIG=32768, bigRing=new Float32Array(BIG);
const BN=8192, bHann=new Float32Array(BN), bRe=new Float32Array(BN), bIm=new Float32Array(BN), bRev=new Uint16Array(BN);
for(let i=0;i<BN;i++) bHann[i]=0.5-0.5*Math.cos(2*Math.PI*i/(BN-1));
for(let i=0,j=0;i<BN;i++){ bRev[i]=j; let bit=BN>>1; while(j&bit){j^=bit;bit>>=1;} j|=bit; }
const bCos=new Float32Array(BN/2), bSin=new Float32Array(BN/2); for(let i=0;i<BN/2;i++){bCos[i]=Math.cos(-2*Math.PI*i/BN);bSin[i]=Math.sin(-2*Math.PI*i/BN);}
function bigFFT(){ for(let i=0;i<BN;i++){ const r=bRev[i]; if(i<r){ let t=bRe[i];bRe[i]=bRe[r];bRe[r]=t; t=bIm[i];bIm[i]=bIm[r];bIm[r]=t; } }
  for(let size=2;size<=BN;size<<=1){ const h=size>>1, step=BN/size;
    for(let i=0;i<BN;i+=size) for(let j=0;j<h;j++){ const c=bCos[j*step], s_=bSin[j*step];
      const a=i+j, b=a+h, tr=bRe[b]*c-bIm[b]*s_, ti=bRe[b]*s_+bIm[b]*c; bRe[b]=bRe[a]-tr; bIm[b]=bIm[a]-ti; bRe[a]+=tr; bIm[a]+=ti; } } }
const KMAX=Math.floor(BN*5000/44100);
function specAt(start){ // 從絕對樣本位置 start 取 8192 點的頻譜（線性幅度）
  for(let i=0;i<BN;i++){ bRe[i]=bigRing[(start+i)&(BIG-1)]*bHann[i]; bIm[i]=0; }
  bigFFT(); const out=new Float32Array(KMAX); for(let k=0;k<KMAX;k++) out[k]=Math.hypot(bRe[k],bIm[k]); return out; }
function rmsAt(start,n){ let s2=0; for(let i=0;i<n;i++){ const v=bigRing[(start+i)&(BIG-1)]; s2+=v*v; } return Math.sqrt(s2/n); }
let pending=null, lastRes=null, queue=[];
const LOWM=50, HIGHM=88;   // 分析的音高範圍 D3～E6
function analyzeCandidate(t0,sr){
  const binHz=sr/BN;
  // --- 音量包絡：起音快、之後下降 ---
  const H=256; const env=[]; for(let s0=t0-2048;s0<t0+BN+256;s0+=H) env.push(rmsAt(s0,H));
  const preN=7, pre=env.slice(0,preN).reduce((a,b)=>a+b,0)/preN+1e-6;     // 按鍵前約 37 毫秒
  const early=env.slice(8,8+6); const peak=Math.max(...early);            // 按鍵後約 32 毫秒內的最大音量
  const after=env.slice(8+6), late=after.slice(-8).reduce((a,b)=>a+b,0)/8; // 後段（約 0.13～0.17 秒）
  const maxAfter=Math.max(...after);
  const attack=peak/pre;
  const ix=ms=>8+Math.round(ms/1000*sr/H); const midA=env.slice(ix(60),ix(100)); const mid=midA.reduce((a,b)=>a+b,0)/midA.length;   // 60～100 毫秒
  // --- 新增的頻譜 ---
  const preS=specAt(t0-BN), postS=specAt(t0+256);
  const nw=new Float32Array(KMAX); let mx=0;
  for(let k=0;k<KMAX;k++){ const d=postS[k]-preS[k]*0.9; nw[k]=d>0?d:0; if(nw[k]>mx) mx=nw[k]; }
  // 允許鋼琴音稍微不準（約 ±35 音分），家裡的琴常常沒有調得很準
  const magAt=f=>{ const c=Math.round(f/binHz), w=Math.max(1,Math.round(f*0.0204/binHz)); if(c+w>=KMAX) return 0;
    let m=0; for(let k=c-w;k<=c+w;k++) if(nw[k]>m) m=nw[k]; return m; };
  const binAt=f=>{ const c=Math.round(f/binHz); return c<KMAX?nw[c]:0; };
  const sal={}; let best=-1, bestM=0;
  for(let m=LOWM;m<=HIGHM;m++){ const f=440*Math.pow(2,(m-69)/12); let v=0;
    for(let h=1;h<=6;h++){ const ff=f*h; if(ff>4900) break; v+=magAt(ff)/Math.pow(h,0.6); }
    sal[m]=v; if(v>best){best=v;bestM=m;} }
  const sv=Object.values(sal).sort((a,b)=>a-b), med=sv[sv.length>>1]+1e-9;
  // 頻譜平坦度（雜音很平、樂音有尖峰）
  const k0=Math.floor(150/binHz), k1=Math.floor(4000/binHz); let lg=0, ar=0, n=0;
  for(let k=k0;k<k1;k++){ const v=nw[k]+mx*1e-4; lg+=Math.log(v); ar+=v; n++; }
  const flat=Math.exp(lg/n)/(ar/n);
  const fundOK = magAt(440*Math.pow(2,(bestM-69)/12)) >= 0.12*mx;
  return {binAt, attack, peak, late, mid, maxAfter, sal, best, bestM, med, flat, mx, magAt, binHz, fundOK};
}
function isPiano(r){
  const v=+$('onsetSens').value;                 // 越靈敏，判定越寬鬆
  const attK=1.1+(10-v)*0.05;  // 預設約 1.25
  const okAttack = r.attack>=attK;
  const okDecay  = r.maxAfter<=r.peak*1.3 && r.late<=r.peak*1.0 && r.mid>=r.peak*0.2;   // 會下降，但不會瞬間消失（敲桌子、拍手會）
  const okTonal  = r.best/r.med>=5 && r.flat<0.35 && r.fundOK;
  const okRange  = r.bestM>LOWM && r.bestM<HIGHM;
  r.why = (okAttack?'':'起音慢 ')+(okDecay?'':(r.mid<r.peak*0.2?'消失太快 ':'沒衰減 '))+(okTonal?'':'沒音高 ')+(okRange?'':'音域外 ');
  return okAttack&&okDecay&&okTonal&&okRange;
}
function noteOK(r,m,allWant){
  const f=440*Math.pow(2,(m-69)/12), need=+$('sens').value;   // 音準門檻 6～35
  const rel=0.12+(need-6)/29*0.45;                                // 預設約 0.25
  const fund=r.magAt(f);
  if(fund<0.10*r.mx) return false;                               // 基音要真的有出現
  if(r.sal[m]<rel*r.best) return false;                          // 要是夠主要的音
  const nb=Math.max(r.binAt(f/1.0595), r.binAt(f*1.0595));     // 相鄰半音只看正中間那一格
  if(fund<nb*1.5) return false;                                  // 基音要比相鄰半音明顯（避免彈錯一個半音）
  if(!allWant.includes(m-12) && (r.sal[m-12]||0)>r.sal[m]*1.1 && r.magAt(f/2)>0.5*fund) return false; // 其實是低八度
  return true;
}
function onPianoHit(r){
  hitCount++; onsetBlink(); lastRes=r;
  if(!document.body.classList.contains('hidenames')) $('heard').textContent=nm(r.bestM);
  if(!following || mode!=='mic') return;
  const st=steps[stepIdx]; if(!st) return;
  if(!$('pitchChk').checked){ advance(); return; }
  const scope=$('pitchScope').value;
  const want= scope==='rh'? st.rh : scope==='lh'? st.lh : st.midi;
  if(!want.length){ advance(); return; }
  if(want.every(m=>noteOK(r,m,st.midi))) advance();
  else { const d=$('hitDot'); d.classList.add('miss'); setTimeout(()=>d.classList.remove('miss'),300); }
}
function detectOnset(ev){
  const x=ev.inputBuffer.getChannelData(0), H=512, sr=micCtx.sampleRate; spCalls++;
  const v=+$('onsetSens').value;                 // 1（遲鈍）～10（靈敏）
  const k=1.6+(10-v)*0.3;                        // 比剛剛（約 70 毫秒內）大幾倍，預設 2.5
  const c=2+(10-v)*0.35;                         // 比平常背景大幾倍，預設 3
  const k0=Math.floor(120*FN/sr), k1=Math.floor(5000*FN/sr);
  for(let i=0;i<x.length;i++) bigRing[(sampleClock+i)&(BIG-1)]=x[i];
  for(let s0=0;s0+H<=x.length;s0+=H){
    ring.copyWithin(0,H); ring.set(x.subarray(s0,s0+H),FN-H);
    for(let i=0;i<FN;i++){ re[i]=ring[i]*hann[i]; im[i]=0; }
    fft();
    const spec=new Float32Array(k1-k0); let flux=0;
    for(let kk=k0;kk<k1;kk++){ const m=Math.hypot(re[kk],im[kk]); spec[kk-k0]=m;
      if(prevSpec){ const d=m-prevSpec[kk-k0]; if(d>0) flux+=d; } }
    prevSpec=spec;
    const t=sampleClock+s0;
    let ok=false;
    if(fluxHist.length>=40){
      let loc=0; for(let i=fluxHist.length-6;i<fluxHist.length;i++) loc+=fluxHist[i]; loc/=6;
      const sorted=fluxHist.slice().sort((a,b)=>a-b), base=sorted[sorted.length>>1];
      ok = flux>loc*k && flux>base*c;
    }
    if(ok && t-lastOnsetSample>0.12*sr && performance.now()>ignoreUntil){
      lastOnsetSample=t; queue.push(t-512);          // 按鍵大約在這一格的開頭；排隊逐一分析
    }
    fluxHist.push(flux); if(fluxHist.length>40) fluxHist.shift();
  }
  sampleClock+=x.length;
  while(queue.length && sampleClock>=queue[0]+256+BN){
    const pending0=queue.shift(); const r=analyzeCandidate(pending0,sr);
    const P=isPiano(r); if(window._cands) window._cands.push({t:+(pending0/sr).toFixed(2),P,att:+r.attack.toFixed(1),dec:+(r.maxAfter/r.peak).toFixed(2),late:+(r.late/r.peak).toFixed(2),mid:+(r.mid/r.peak).toFixed(2),ton:+(r.best/r.med).toFixed(1),flat:+r.flat.toFixed(2),m:r.bestM,fund:r.fundOK});
    if(P) onPianoHit(r); else { rejCount++; lastWhy=r.why; }
  }
}
let rejCount=0, lastWhy='';
function stopMic(){ try{ if(micCtx) micCtx.close(); }catch(_){} micCtx=null; if(sp){sp.onaudioprocess=null;try{sp.disconnect();}catch(_){} sp=null;} if(micTimer)clearInterval(micTimer); micTimer=null; if(micStream)micStream.getTracks().forEach(t=>t.stop()); micStream=null; analyser=null; $('meter').style.width='0'; }
function peakDb(f,binHz,w=2){ const c=Math.round(f/binHz); let m=-200; for(let k=c-w;k<=c+w;k++) if(fbuf[k]>m) m=fbuf[k]; return m; }
function onsetBlink(){ const d=$('hitDot'); d.classList.add('on'); clearTimeout(d._t); d._t=setTimeout(()=>d.classList.remove('on'),180); }
function listen(){
  if(!analyser) return;
  if(micCtx.state!=='running') micCtx.resume();
  analyser.getFloatTimeDomainData(tbuf);
  // 只看最新的約 20 毫秒，才抓得到琴鍵敲下去的那一瞬間
  const N=1024, L=tbuf.length; let sum=0; for(let i=L-N;i<L;i++) sum+=tbuf[i]*tbuf[i];
  const rms=Math.sqrt(sum/N);
  $('meter').style.width=Math.min(100,Math.sqrt(rms)*250)+'%';
  const tr=micStream&&micStream.getAudioTracks()[0];
  $('diag').textContent=`v9｜麥克風：${tr?tr.readyState+(tr.muted?'(靜音)':''):'無'}｜${micCtx.state} ${micCtx.sampleRate}Hz｜音量 ${rms.toFixed(4)}｜鋼琴聲 ${hitCount} 次｜略過非鋼琴聲 ${rejCount} 次${lastWhy?'（'+lastWhy.trim()+'）':''}`;
  const now=performance.now();
  hist.push(rms); if(hist.length>3) hist.shift();

}

// 點琴鍵
for(const k in keyEl){ keyEl[k].style.cursor='pointer';
  keyEl[k].addEventListener('pointerdown',ev=>{ ev.preventDefault(); ensureAudio(); const m=+k;
    tone(m,ctx.currentTime,0.5,0.22);
    if(following && mode==='tap'){ const st=steps[stepIdx]; if(st && st.midi.includes(m)){ tapped.add(m); if(st.midi.every(x=>tapped.has(x))) advance(); } }
  }); }

// 模式切換與按鈕
function setMode(v){
  if(playing) stop(); if(following){ following=false; stopMic(); }
  mode=v; const f=v!=='auto';
  $('follow').classList.toggle('show',f); $('hint2').style.display=f?'none':'';
  $('meterBox').style.display= v==='mic'?'':'none'; $('chkBox').style.display= v==='mic'?'':'none'; $('onsetBox').style.display= v==='mic'?'':'none'; $('hitDot').style.display= v==='mic'?'':'none'; updSens();
  $('play').textContent= f?'▶ 開始跟彈':'▶ 播放'; $('msg').textContent='';
  if(f){ buildSteps(); stepIdx=0; showWant(); following=false; }
}
function updSens(){ const on=(mode==='mic'&&$('pitchChk').checked)?'':'none'; $('sensBox').style.display=on; $('scopeBox').style.display=on; }
$('pitchChk').onchange=updSens;
$('mode').onchange=e=>setMode(e.target.value);
$('play').onclick=async()=>{
  if(mode==='auto') return playing?stop():start();
  if(following){ following=false; stopMic(); $('play').textContent='▶ 開始跟彈'; return; }
  buildSteps(); if(stepIdx>=steps.length) stepIdx=0; showWant();
  if(mode==='mic'){ const ok=await startMic(); if(!ok) return; lastAdvance=performance.now(); onsetAt=0; }
  else ensureAudio();
  following=true; $('play').textContent='⏸ 暫停';
};
$('restart').onclick=()=>{ if(mode==='auto') return seek(0); stepIdx=0; tapped.clear(); showWant(); followLt=0; };
const _seek=seek;
seek=function(l){ if(mode==='auto') return _seek(l); buildSteps(); const i=steps.findIndex(st=>st.lt>=l-1e-6); stepIdx=i<0?0:i; tapped.clear(); showWant(); };
['hand','rep'].forEach(id=>$(id).addEventListener('change',()=>{ if(mode!=='auto'){ buildSteps(); stepIdx=Math.min(stepIdx,steps.length-1); showWant(); } }));
</script>
